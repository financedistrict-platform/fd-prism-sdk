[tool.poetry]
name = "prism-django"
version = "1.0.0"
description = "Prism SDK - Django middleware"
authors = ["FD Technologies <engineering@1stdigital.tech>"]
readme = "README.md"
packages = [{include = "prism_django"}]

[tool.poetry.dependencies]
python = "^3.8"
prism-sdk-core = {path = "../core", develop = true}
django = "^4.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-django = "^4.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
