[tool.poetry]
name = "prism-flask"
version = "1.0.0"
description = "Prism SDK - Flask middleware"
authors = ["FD Technologies <engineering@1stdigital.tech>"]
readme = "README.md"
packages = [{include = "prism_flask"}]

[tool.poetry.dependencies]
python = "^3.8"
prism-sdk-core = {path = "../core", develop = true}
flask = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-flask = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
