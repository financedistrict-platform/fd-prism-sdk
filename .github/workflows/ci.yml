name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check manifests
        run: npm run test:manifests

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [core, flask, fastapi, django]
    defaults:
      run:
        working-directory: python/packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Test
        run: |
          if [ -d tests ]; then
            poetry run pytest -q
          fi

      - name: Build
        run: poetry build

  java:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B verify

  csharp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Prism.SDK.sln --configuration Release

      - name: Test
        run: dotnet test Prism.SDK.sln --configuration Release --no-build
