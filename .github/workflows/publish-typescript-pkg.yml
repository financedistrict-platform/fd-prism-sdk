name: Publish TypeScript Packages

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-typescript-pkg
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Enforce release branch
        if: github.ref_name != 'main'
        run: |
          echo "::error::Publish only from main. Got '${{ github.ref_name }}'."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci
        working-directory: typescript

      - name: Build packages
        run: npm run build
        working-directory: typescript

      - name: Run tests
        run: npm run test
        working-directory: typescript

      - name: Publish unpublished versions
        working-directory: typescript
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          for package in core express http fastify nestjs nextjs; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already on npm, skipping"
              continue
            fi
            (cd "packages/$package" && npm publish --provenance --access public --tag "$DIST_TAG")
            tag="ts-$package-v$version"
            git tag "$tag"
            git push origin "$tag"
            gh release create "$tag" --title "$name v$version" --generate-notes
          done
